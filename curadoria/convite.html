<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Acesso ao grupo — LetsMaker</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><a class="brand" href="./">Lets<span>Maker</span></a><div class="form-card"><p class="eyebrow">ACESSO AO GRUPO</p><h1>Seu próximo passo.</h1><p>O convite é consultado após a validação da sua compra e do diagnóstico.</p><button class="button" id="open">Abrir WhatsApp ↗</button><p class="status" id="status" role="status"></p></div></main><script>document.getElementById('open').onclick=async()=>{try{const r=await fetch('/api/curadoria/invite',{method:'POST',headers:{Authorization:'Bearer '+(sessionStorage.lmAccess||'')}});const d=await r.json();if(!r.ok)throw Error(d.error);location.assign(d.url);}catch(e){document.getElementById('status').textContent=e.message||'Acesso indisponível. Procure a equipe para recuperar seu cadastro.';}};</script></body></html>
