<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Login — LetsMaker</title>
<style>
  :root{
    --bg:#05070d; --card:rgba(255,255,255,.04); --border:rgba(255,255,255,.08);
    --cyan:#22d3ee; --txt:#eee; --txm:#8a8f9c; --err:#f87171;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(700px 500px at 50% 30%, rgba(34,211,238,.08), transparent), var(--bg);
    color:var(--txt); font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:20px;
  }
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:20px;
    padding:40px 36px; width:330px; text-align:center; backdrop-filter:blur(20px);
    box-shadow:0 30px 80px rgba(0,0,0,.5);
  }
  .lk{width:46px;height:46px;border-radius:14px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;
    font-size:22px;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.3);}
  h2{font-size:21px;margin-bottom:6px;}
  p{color:var(--txm);font-size:13px;margin-bottom:22px;}
  input{width:100%;padding:13px 16px;border-radius:11px;border:1px solid var(--border);
    background:rgba(255,255,255,.05);color:#fff;font-size:15px;margin-bottom:14px;outline:none;}
  input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.15);}
  button{width:100%;padding:13px;border:none;border-radius:11px;cursor:pointer;font-weight:700;font-size:15px;
    color:#04121a;background:linear-gradient(135deg,var(--cyan),#38bdf8);}
  button:disabled{opacity:.6;cursor:default;}
  .err{color:var(--err);font-size:13px;margin-top:10px;display:none;}
</style>
</head>
<body>
  <div class="card">
    <div class="lk">🔒</div>
    <h2>LetsMaker</h2>
    <p>Acesso restrito à equipe</p>
    <input type="password" id="pwd" placeholder="Senha" autofocus onkeydown="if(event.key==='Enter')entrar()">
    <button id="btn" onclick="entrar()">Entrar</button>
    <div class="err" id="err">Senha incorreta.</div>
  </div>

  <script>
    async function entrar(){
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');
      const pwd = document.getElementById('pwd').value;
      err.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Entrando…';
      try{
        const r = await fetch('/api/auth-login', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ password: pwd })
        });
        if(!r.ok){
          const d = await r.json().catch(()=>({}));
          err.textContent = d.error || 'Senha incorreta.';
          err.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Entrar';
          return;
        }
        const params = new URLSearchParams(location.search);
        const redirect = params.get('redirect') || '/vendas.html';
        location.href = redirect;
      }catch(e){
        err.textContent = 'Erro de conexão. Tenta de novo.';
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    }
  </script>
</body>
</html>
